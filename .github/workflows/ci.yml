name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR and master runs are cancelled; tag releases run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' }}

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webgen/package-lock.json

      - name: Install dependencies
        working-directory: webgen
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: webgen
        run: npm run typecheck

      - name: Lint
        working-directory: webgen
        run: npm run lint

      - name: Check card SVG copies are in sync
        working-directory: webgen
        run: |
          npm run sync:card-svg
          git diff --exit-code -- src/assets/card-front.svg src/assets/card-back.svg

      - name: Check formatting
        working-directory: webgen
        run: npm run format:check

      - name: Build frontend
        working-directory: webgen
        run: npm run build

      - name: Verify card artwork
        run: python3 tools/verify_card.py

      - name: Validate SVG files
        run: |
          python3 - <<'PY'
          import subprocess
          import xml.etree.ElementTree as ET

          files = [
              path
              for path in subprocess.check_output(
                  ["git", "ls-files", "-z", "--", "*.svg"]
              ).decode("utf-8").split("\0")
              if path
          ]
          for path in files:
              ET.parse(path)
              print(f"ok  {path}")
          print(f"{len(files)} SVG files are well-formed")
          PY

      - name: Package frontend and SVG artifacts
        run: python3 .github/scripts/package_artifacts.py --output artifacts

      - name: Upload web artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: passcard42-web
          path: artifacts/staging/frontend
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Upload SVG artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: passcard42-svg
          path: artifacts/staging/svg
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: passcard42-release-assets
          path: artifacts/release/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  docker-check:
    name: Validate container image
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image without pushing
        uses: docker/build-push-action@v7.4.0
        with:
          context: webgen
          file: ./webgen/Dockerfile
          push: false
          cache-from: type=gha

  docker:
    name: Publish container image
    # `latest` only follows master; a tag publishes semver aliases and the tag itself.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=passcard42
            org.opencontainers.image.description=dn42 passport card generator
            org.opencontainers.image.url=https://github.com/${{ env.IMAGE_NAME }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: webgen
          file: ./webgen/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  release:
    name: Draft release
    # Draft so the release can be reviewed before publishing.
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8.0.2
        with:
          name: passcard42-release-assets
          path: release-assets

      - name: List release assets
        run: ls -lh release-assets

      - name: Create draft release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            Frontend build and SVG sources are attached as ZIP archives.

            Container image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}`
            plus the usual semver aliases. The `latest` tag is only moved by
            pushes to `master`.
