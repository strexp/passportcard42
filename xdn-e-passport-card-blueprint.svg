<text x="8.000" y="87.300" font-family="'Noto Sans',sans-serif" font-size="0.900" font-weight="500" fill="#2B2B2A" text-anchor="start" letter-spacing="0.000">1 · Zone boundaries are construction guides and are not printed on the card (Doc 9303-5, 3.3).</text>
<text x="8.000" y="89.700" font-family="'Noto Sans',sans-serif" font-size="0.900" font-weight="500" fill="#2B2B2A" text-anchor="start" letter-spacing="0.000">2 · Master files are authoritative: xdn-e-passport-card-front.svg / -back.svg. Do not overwrite them.</text>
<text x="8.000" y="92.100" font-family="'Noto Sans',sans-serif" font-size="0.900" font-weight="500" fill="#2B2B2A" text-anchor="start" letter-spacing="0.000">3 · Zone I header 9.60 mm (limit 11.00 mm); all data stays 2.00 mm inside the trim.</text>
<text x="8.000" y="94.500" font-family="'Noto Sans',sans-serif" font-size="0.900" font-weight="500" fill="#2B2B2A" text-anchor="start" letter-spacing="0.000">4 · Zone V portrait is 26.00 × 32.50 mm on a feathered white plate, with no frame or outline.</text>
<text x="8.000" y="96.900" font-family="'Noto Sans',sans-serif" font-size="0.900" font-weight="500" fill="#2B2B2A" text-anchor="start" letter-spacing="0.000">5 · Zone VII: 3 × 30 OCR-B, 77.70 mm at x = 4.00 mm, pitch 4.23 mm, zone height 23.30 mm.</text>
<text x="8.000" y="99.300" font-family="'Noto Sans',sans-serif" font-size="0.900" font-weight="500" fill="#2B2B2A" text-anchor="start" letter-spacing="0.000">6 · CAN 114514 is on the front lower right (baseline 50.44 mm); it is not repeated on the back.</text>
<text x="8.000" y="101.700" font-family="'Noto Sans',sans-serif" font-size="0.900" font-weight="500" fill="#2B2B2A" text-anchor="start" letter-spacing="0.000">7 · Red dashed = zone boundary; blue dashed = 2.00 mm margin. Dimensions are in millimetres.</text>
<text x="8.000" y="107.800" font-family="'Noto Sans',sans-serif" font-size="0.760" font-weight="500" fill="#6E6D6B" text-anchor="start" letter-spacing="0.000">Union of Distributed Networks · NIA42 · NIA-MNT · ISO/IEC 7810 ID-1 · ICAO Doc 9303-5 TD1</text>
